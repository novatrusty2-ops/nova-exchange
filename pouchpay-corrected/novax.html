<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova X - Production Dashboard</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffffff; color: #111111; margin: 0; padding: 40px; }
  .container { max-width: 800px; margin: 0 auto; border: 1px solid #eaeaea; border-radius: 12px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
  h1 { font-size: 24px; font-weight: 600; margin-top: 0; color: #000000; }
  .card { background: #fafafa; border: 1px solid #efefef; border-radius: 8px; padding: 20px; margin-top: 20px; }
  .status { display: inline-block; padding: 4px 12px; background: #e6f4ea; color: #137333; border-radius: 12px; font-size: 12px; font-weight: 500; }
  button { background: #000000; color: #ffffff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 500; cursor: pointer; margin-top: 16px; }
  button:hover { background: #333333; }
</style>
</head>
<body>
<div class="container">
  <h1>Nova X Production Dashboard</h1>
  <p>Decentralized Exchange & Multi-Chain Liquidity Router (Port 3003)</p>
  <div class="card">
    <h3>Vault Reserve: router-novax-usd</h3>
    <p>Allocation: <strong>100,000,000,000 USD</strong></p>
    <span class="status">FULLY ROUTED</span>
  </div>
  <button onclick="alert('Nova X Synchronization Active')">Sync Router State</button>
</div>
</body>
</html>
