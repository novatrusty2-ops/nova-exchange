name: Frontend contract tests

on:
  push:
    branches: [master, main]
    paths: ['pouchpay-corrected/frontend/**', 'pouchpay-corrected/*.html', 'pouchpay-corrected/nova_apps_white/*.html', '.github/workflows/frontend-test.yml']
  pull_request:
    paths: ['pouchpay-corrected/frontend/**', 'pouchpay-corrected/*.html', 'pouchpay-corrected/nova_apps_white/*.html', '.github/workflows/frontend-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pouchpay-corrected
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:frontend
