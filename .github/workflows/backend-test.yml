name: Backend build and tests

on:
  push:
    branches: [master, main]
    paths: ['pouchpay-corrected/**', '!pouchpay-corrected/nova-contracts-engine/**', '.github/workflows/backend-test.yml']
  pull_request:
    paths: ['pouchpay-corrected/**', '!pouchpay-corrected/nova-contracts-engine/**', '.github/workflows/backend-test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pouchpay-corrected
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pouchpay-corrected/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
